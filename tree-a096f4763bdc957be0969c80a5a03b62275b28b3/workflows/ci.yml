name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Run deterministic package and source contracts (no client or agent result claimed)
        run: tests/run-contracts.sh
      - name: Check shell syntax
        run: |
          for script in tests/*.sh tests/fixtures/*.sh; do
            sh -n "$script"
          done
      - name: Validate JSON manifests
        run: |
          jq -e . plugin.json .codex-plugin/plugin.json .claude-plugin/plugin.json .claude-plugin/marketplace.json .muse-plugin/plugin.json catalog.json
