interface:
  display_name: "PR: Merge"
  short_description: "Guarded PR merge, queue entry, and queue watch"
  default_prompt: "Use $tailrocks-pr-merge to ready, merge, dequeue, or watch one pull request. Run the plan first, then run the step with --confirm set to the PR number. The script output is the authority. Never use admin bypass or delete a branch."
policy:
  allow_implicit_invocation: false
