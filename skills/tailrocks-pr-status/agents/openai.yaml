interface:
  display_name: "PR Status"
  short_description: "Merge-readiness verdict and next step for each PR"
  default_prompt: "Use $tailrocks-pr-status to read the merge-readiness of one pull request or all open pull requests. Report READY, WAITING, or BLOCKED exactly as the script prints it, with each blocker's next line and owner. Do not change the PR, and never conclude READY yourself."
policy:
  allow_implicit_invocation: true
