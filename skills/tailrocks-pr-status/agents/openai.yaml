interface:
  display_name: "PR Status"
  short_description: "One merge-readiness verdict per pull request, with the next action for each blocker"
  default_prompt: "Use $tailrocks-pr-status to read the merge-readiness of one pull request or all open pull requests. Report READY, WAITING, or BLOCKED and act on each next step. Never conclude READY yourself."
policy:
  allow_implicit_invocation: true
