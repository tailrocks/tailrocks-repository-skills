# Example .config/pr-policy.toml for a repository that:
#   - reviews with comments that carry a verdict line,
#   - uses review bots,
#   - merges through a squash merge queue,
#   - requires a DCO sign-off,
#   - regenerates golden files and keeps an inventory.
# Replace every name, path, and login below with your own.

schema = 1

[branches]
protected = ["main", "release/*"]
bases = ["release/*"]

[checks]
required = ["Required", "Required verdict"]
flaky = []
accept_skipped = []
base_sensitive = ["Required"]
cancellation_is_load = true

[review]
source = "comment-verdict"
# Counted reviewers. An empty list counts every writer.
reviewers = []
# The PR author's own reviews count only when this is true. It fits a process
# in which agent reviews are posted under the owner's account. The default is
# false: an author never approves their own PR.
count_author = true
# Verdict lines, matched case-insensitively on any line. Bold markup is allowed.
approve_pattern = 'verdict[^a-z]{0,6}(\*\*)?approve'
changes_pattern = 'verdict[^a-z]{0,6}(\*\*)?changes needed'
# An approval that also holds a blocking P1 finding is not an approval.
blocking_pattern = '\bP1[ =:]+[1-9]|\[P1\]|P1 Badge|\*\*\[?P1\b|^#+ *P1\b|^\s*[-*]?\s*P1\s*[—:-]'
flags = "im"
carry_over = "clean-base-merge"
max_carry_merges = 3
rerequest = { comment = "Please review the new head.", reviewers = [] }

[threads]
bots = ["chatgpt-codex-connector"]
fix_pattern = '\bP1\b'

[dco]
required = true
bot_authors = ["renovate[bot]", "dependabot[bot]"]
bot_commits = "exempt"
fix = "rewrite-trailers"
dequeue_for_fix = false

[merge]
method = "squash"
queue = "required"
jump = "labelled"
jump_labels = ["queue:jump"]
delete_branch = "own-only"
# Paths that need the user's confirmation before a merge. The default list
# holds .github, release, auth, and migration directories. An empty list turns
# the check off. Replace the globs with your own.
high_risk_paths = [".github/**", "**/release/**", "**/auth/**", "**/migrations/**"]
# Seconds between the polls of `merge.ts watch`. The flag --interval overrides it.
watch_interval_seconds = 180

[draft]
create_as_draft = true
ready_when = "checks-and-review"

[labels]
# Label mode is opt-in: set pr_ci = "label" and full CI runs on a PR only
# while it holds one of the two labels below. This process runs CI always.
pr_ci = "always"
run_once = "ci:run"
run_always = "ci:auto"

[ci]
congestion_queue_length = 5
max_refreshes = 2
max_refreshes_congested = 0

[issues]
link = "closes-when-complete"
done_when_heading = "Done when"
done_when = "warn"

[pr_body]
sections = ["Why", "What", "Proof", "Done when"]
template = ".github/PULL_REQUEST_TEMPLATE.md"

[[prepush]]
name = "fmt"
run = ["cargo", "fmt", "--all", "--check"]
when_changed = ["**/*.rs"]

[[prepush]]
name = "clippy"
run = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
when_changed = ["**/*.rs"]

[[regenerate]]
name = "goldens"
run = ["scripts/capture-goldens.sh", "capture"]
when_changed = ["generator/**"]
outputs = ["fixtures/goldens/**"]

[[inventories]]
name = "source-inventory"
file = "docs/inventory/sources.txt"
added = ["crates/*/src/**/*.rs"]
exclude = ["**/tests/**", "**/benches/**"]
group_depth = 2

[fleet]
freeze = false
hold = []
# Merges or enqueues that one fleet pass may start. Unset: 3 through a merge
# queue, 1 for direct merges. A pass also keeps the queue length plus its own
# enqueues at or below ci.congestion_queue_length.
max_merges_per_pass = 3
# The same limit when the queue is at or above ci.congestion_queue_length.
max_merges_per_pass_congested = 0
