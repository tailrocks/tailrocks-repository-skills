interface:
  display_name: "Tailrocks: Review PR"
  short_description: "Review a pull request with verified, high-signal findings"
  default_prompt: "Use $tailrocks-review-pr on this pull request: verify every correctness finding against the code before reporting it, run the structural pass with a named restructure per finding, run only the skill-local lanes triggered by the diff, use an external specialist only when explicitly requested and available, and route findings to a direct author fix by default. Report only; do not post, edit, approve, or merge."
policy:
  allow_implicit_invocation: false
