# Shared Tailrocks package structure and native resource validation.
# Update the immutable profile revision and SHA-256 together.
version: 1
extends:
  - https://raw.githubusercontent.com/tailrocks/tailrocks-skills/5b2fc308a6f5a48d0c0e85c18e8db43c97e06433/standards/alint/active.yml#sha256-731e31c34fb41049206f69d7182f3059d16bf3e30c1c49cd16190121af89fe57
# Narrow ignore for rule reference-names-portable (exact path, one file).
# Reason: tailrocks-pr-template manages the exact upstream filename
# PULL_REQUEST_TEMPLATE.md, and its SKILL.md links this reference copy.
# A lowercase rename would break the skill task. Verified 2026-10-07:
# the file carries no retired alias and no executable bit, so this
# ignore hides no other finding. Revisit in Phase D only if the skill
# stops using the upstream filename.
ignore:
  - skills/tailrocks-pr-template/references/PULL_REQUEST_TEMPLATE.md
# Narrow ignore for rule skill-max-depth (vendored library copies only).
# Reason: each script-backed skill must be self-contained, so `bun run
# vendor` copies lib/ and schemas/ into skills/<id>/scripts/. The copies
# keep the folder layout of lib/ (for example lib/policy/load.ts), which
# is one level deeper than the rule allows. The copies are generated,
# never hand-edited, and a test fails when they differ from lib/.
  - skills/*/scripts/lib/**
  - skills/*/scripts/schemas/**

rules:
  - id: native-package-valid
    kind: command_idempotent
    level: error
    command: ["python3", "scripts/validate-package.py", "--check"]
    message: "Native manifests, registrars, invocation policies, and bundled resources must agree."
