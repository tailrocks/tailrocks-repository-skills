          env: "false"
          install: "false"
          sha256: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
          version: 2026.10.8
      - name: Prepare pinned tools
        run: mise --no-config --no-env --no-hooks install node@24.21.0
      - name: Check strict JSON
        run: "mise --no-config --no-env --no-hooks exec node@24.21.0 -- node -e 'const fs = require(\"fs\"), path = require(\"path\"); let fail = 0; const skip = new Set([\".git\", \"node_modules\", \"target\"]); function walk(d) { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); if (e.isDirectory()) { if (!skip.has(e.name)) walk(p); } else if (e.name.endsWith(\".json\")) check(p); } } function check(f) { const s = fs.readFileSync(f, \"utf8\"); try { JSON.parse(s); } catch (e) { console.log(\"invalid-json:\" + f + \":\" + e.message); fail = 1; return; } const d = dups(s); if (d !== null) { console.log(\"duplicate-key:\" + f + \":\" + d); fail = 1; } } function dups(s) { const st = [new Set()]; let i = 0; while (i < s.length) { const c = s[i]; if (c === \"\\\"\") { let j = i + 1; while (j < s.length) { if (s[j] === \"\\\\\") { j += 2; continue; } if (s[j] === \"\\\"\") break; j++; } let k = j + 1; while (k < s.length && /\\s/.test(s[k])) k++; if (s[k] === \":\") { const t = st[st.length - 1]; const v = JSON.parse(s.slice(i, j + 1)); if (t.has(v)) return v; t.add(v); } i = j + 1; continue; } if (c === \"{\") st.push(new Set()); else if (c === \"}\") st.pop(); i++; } return null; } const files = JSON.parse(process.argv[1] || \"null\"); if (files === null) walk(\".\"); else for (const f of files) { let p = \".\", safe = true; for (const part of f.split(\"/\")) { p = path.join(p, part); try { if (fs.lstatSync(p).isSymbolicLink()) safe = false; } catch { safe = false; } } if (!safe || path.extname(f).toLowerCase() !== \".json\" || !fs.existsSync(f) || !fs.statSync(f).isFile()) { console.log(\"invalid-json-path:\" + f); fail = 1; } else check(f); } process.exitCode = fail;' null"
