name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Run deterministic source contracts (no client or agent result claimed)
        run: tests/run-contracts.sh
      - name: Check shell syntax
        run: |
          for script in tests/*.sh tests/fixtures/*.sh; do
            sh -n "$script"
          done
      - name: Validate JSON manifests
        run: |
          jq -e . plugin.json .codex-plugin/plugin.json .claude-plugin/plugin.json .claude-plugin/marketplace.json catalog.json
      - name: Validate skill inventory
        run: |
          test "$(find skills -name SKILL.md | wc -l | tr -d ' ')" = 3
          test "$(jq -r '.skills | length' catalog.json)" = 3
          grep -F 'name: repo-merge' skills/repo-merge/SKILL.md
          grep -F 'disable-model-invocation: true' skills/repo-merge/SKILL.md
